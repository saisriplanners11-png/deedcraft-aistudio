services:
  - type: web
    name: deedcraft-aistudio
    runtime: node
    # DOCX files and metadata persist in Supabase; no Render disk required.
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEMPLATE_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_TEMPLATE_BUCKET
        value: deed-templates
      - key: TEMPLATE_ADMIN_PASSWORD
        sync: false
      - key: EXTRACTION_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EXTRACT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_VERIFY_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
